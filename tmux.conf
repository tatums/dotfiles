##### PREFIX ############################################################

unbind C-b
set -g prefix C-a
bind C-a send-prefix


##### TERMINAL / COLORS #################################################

# Requires tmux ≥ 3.2 (standard on macOS via brew)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"


##### GENERAL BEHAVIOR ##################################################

set -g mode-keys vi
set -g status-keys vi

set -g history-limit 10000
set -g mouse on
set -g focus-events on

# Let tmux talk to the system clipboard (OSC 52)
set -g set-clipboard on


##### COPY MODE (VI STYLE, MACOS SAFE) ##################################

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Yank → macOS system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Cancel copy mode
bind-key -T copy-mode-vi Escape send-keys -X cancel


##### PASTE ############################################################

# Paste tmux buffer
bind p paste-buffer


##### WINDOWS / PANES ###################################################

# Window indexing starts at 1
set -g base-index 1
setw -g pane-base-index 1

# Splits (keep current path)
bind \\ split-window -h -c '#{pane_current_path}'
bind -  split-window -v -c '#{pane_current_path}'

# Window switching (your bindings)
bind -n S-up    new-window
bind -n S-down  confirm-before -p "kill-window #W? (y/n)" kill-window
bind -n S-left  prev
bind -n S-right next

# Pane operations (your bindings)
bind -n C-M-up    respawn-pane -k
bind -n C-M-down  kill-pane
bind -n C-M-left  swap-pane -U
bind -n C-M-right swap-pane -D

# Clear scrollback
bind -n C-k clear-history

# Warning: tmux extended-keys-format is xterm. Pi works best with csi-u. Add `set -g extended-keys-format csi-u` to ~/.tmux.conf and restart tmux.
#
# Pi is warning that tmux is forwarding modified keys (Shift+Enter, Ctrl+Enter, and so on) in the older xterm modifyOtherKeys encoding. Pi wants
# the CSI-u encoding, which is less ambiguous. The warning gives you the main line, but you probably need a couple more for it to work end to end.
#
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

##### STATUS LINE #######################################################

set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-position bottom

set -g status-left-length 60
set -g status-right-length 90

# Status bar turns amber when any pane is zoomed
set -g status-style '#{?window_zoomed_flag,fg=white bg=colour198 bold,fg=colour4 bg=black}'

set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-current-style '#{?window_zoomed_flag,fg=white bg=colour125 bold,fg=black bg=cyan bold}'

# Zoom indicator — right-aligned
set -g status-right '#{?window_zoomed_flag, ⚠ ZOOMED ,}'
set -g status-right-style '#{?window_zoomed_flag,fg=white bg=colour125 bold,default}'


##### ACTIVITY NOTIFICATIONS ############################################

setw -g monitor-activity on
set -g visual-activity on


##### SSH ##############################################################

# Preserve SSH agent socket
set-environment -g SSH_AUTH_SOCK ~/.ssh/ssh_auth_sock


##### RELOAD ############################################################

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


##### PLUGINS ###########################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run -b '~/.tmux/plugins/tpm/tpm'


bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

